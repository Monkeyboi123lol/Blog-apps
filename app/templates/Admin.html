<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Page</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style3.css') }}"
    />
  </head>
  <body>
    <div class="sidebar">
      <nav>
        <ul>
          <li><a href="{{ url_for('main.index') }}">Home</a></li>
          <li><a href="{{ url_for('main.signup') }}">Sign Up</a></li>
          <li><a href="{{ url_for('main.login') }}">Log In</a></li>
          <li><a href="">Admin Panel</a></li>
        </ul>
      </nav>
    </div>
    <div class="admin-header">
      <h2>Admin Center</h2>
      <a href="">Log Out</a>
    </div>
    <div class="main">
      <h1>New Post</h1>
      <form>
        <label>Title:</label>
        <input type="text" />
        <label>Slug URL Tag:</label>
        <input type="text" />
        <label>Featured Image URL:</label>
        <input type="text" />
        <label>Description:</label>
        <input type="text" />
        <label>Publish Status:</label>
        <select>
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
      </form>
      <button type="submit">Post</button>
      <div class="post-list">
        <h1>Managed Posts</h1>
        <ul>
          <div>
            <h1>Techno Blade</h1>
            <p>Techno blade was the best minecraft play ever!</p>
            <p class="status2">Published</p>
          </div>
          <div>
            <button>Draft</button>
            <button>Delete</button>
          </div>
          <div>
            <h1>AI taking over</h1>
            <p>AI is taking over the world!</p>
            <p class="status">Draft</p>
          </div>
          <div>
            <button>Publish</button>
            <button>Delete</button>
          </div>
        </ul>
      </div>
    </div>
  </body>
</html>
